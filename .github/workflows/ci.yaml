name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: noti_mesh
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: noti_mesh_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U noti_mesh"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NOTI_TEST_DATABASE_URL: postgresql://noti_mesh:test-only@localhost:5432/noti_mesh_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - run: python3 -m pip install telethon==1.45.0
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: docker build .
